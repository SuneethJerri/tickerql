[project]
name = "sqlproj-ingest"
version = "0.1.0"
description = "Market data ingestion for the stock/crypto analytics platform"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=1.6.0",
    "pandas>=2.2",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
ingest = "ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
